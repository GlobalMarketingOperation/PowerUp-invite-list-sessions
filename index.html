<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the next session</title>
  <style>
    :root {
      --bg: #0F3D30;          /* same dark green as the SharePoint section */
      --accent: #43D096;      /* green used in "POWER-UP: INSPIRATIONAL" */
      --accent-dark: #36B581;
      --white: #FFFFFF;
      --muted: #CFE3DA;
      --text-dark: #0F3D30;
      --error: #FF9C8F;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--white);
    }
    .box {
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 18px 22px;
      border: 1px solid var(--accent);
      border-radius: 8px;
    }
    .text { flex: 1 1 45%; }
    .eyebrow {
      margin: 0 0 4px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .intro {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--muted);
    }
    form { flex: 1 1 55%; }
    .row { display: flex; gap: 10px; }
    .sr-only { position: absolute; left: -9999px; }
    input[type="email"] {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      font-size: 0.9rem;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--white);
      color: #1F1F1F;
    }
    input[type="email"]:focus { outline: 2px solid var(--accent); }
    button {
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      background: var(--accent);
      color: var(--text-dark);
      border: 1px solid var(--accent);
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      min-height: 18px;
    }
    .consent {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
    }
    .consent input { margin: 0; accent-color: var(--accent); }
    .msg { font-size: 0.8rem; font-weight: 700; }
    .msg.ok { color: var(--accent); }
    .msg.err { color: var(--error); }

    @media (max-width: 760px) {
      .box { flex-direction: column; align-items: stretch; gap: 14px; }
      .row, .bottom { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <section class="box">
    <div class="text">
      <p class="eyebrow">Power-Up: Session invites</p>
      <h1>Not getting the session invites?</h1>
      <p class="intro">Add your email and we'll include you in the next Power-Up session.</p>
    </div>

    <form id="joinForm" novalidate>
      <div class="row">
        <label for="email" class="sr-only">Your email</label>
        <input type="email" id="email" placeholder="your.name@signify.com" required />
        <button type="submit" id="submitBtn">Add me</button>
      </div>
      <div class="bottom">
        <label class="consent">
          <input type="checkbox" id="consent" />
          I agree that my email is used only for Power-Up session invites.
        </label>
        <span id="msg" class="msg" aria-live="polite"></span>
      </div>
    </form>
  </section>

  <script>
    const FLOW_URL = "https://0458ee4aa906e0628640d9914f2d48.4c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/17/workflows/bf650759845548daa201263c93371331/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GQadXVKWVKpk-ap5jqZakCTxwbb4ukgtz9v1vKotIUM";

    const form = document.getElementById("joinForm");
    const emailInput = document.getElementById("email");
    const consent = document.getElementById("consent");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = "msg " + (type || "");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim().toLowerCase();

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMsg("Please enter a valid email.", "err");
        return;
      }
      if (!consent.checked) {
        showMsg("Please tick the box first.", "err");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending...";
      showMsg("");

      try {
        const res = await fetch(FLOW_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: email,
            submittedAt: new Date().toISOString(),
            source: "SharePoint session sign-up"
          })
        });
        if (!res.ok) throw new Error("Request failed");
        showMsg("✅ Thank you! You're on the list.", "ok");
        form.reset();
      } catch (err) {
        showMsg("Something went wrong. Please try again.", "err");
      } finally {
        btn.disabled = false;
        btn.textContent = "Add me";
      }
    });
  </script>
</body>
</html>
